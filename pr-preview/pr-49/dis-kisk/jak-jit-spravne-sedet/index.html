        conditions: [],
        checklist: [
          { id: 1, text: 'Domluvit někoho, kdo bude vybírat poštu' },
          { id: 2, text: 'Zvážit přesměrování pošty' },
          { id: 3, text: 'Pokud máš datovou schránku: nastavit přístup někomu dalšímu' },
          { id: 4, text: 'Dát plnou moc pro přebírání zásilek' },
        ]
      },
    ];

    // =====================================================
    // HOOKS & UTILS
    // =====================================================

    function useLocalStorage(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const stored = localStorage.getItem(key);
          return stored ? JSON.parse(stored) : initialValue;
        } catch {
          return initialValue;
        }
      });

      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(value));
      }, [key, value]);

      return [value, setValue];
    }

    function generatePlan(responses) {
      // Filtruj položky podle podmínek
      let items = PLAN_ITEMS.filter(item => {
        if (item.conditions.length === 0) return true;
        return item.conditions.some(cond => {
          const userValue = responses[cond.field] || [];
          if (Array.isArray(userValue)) {
            return userValue.includes(cond.includes);
          }
          return userValue === cond.includes;
        });
      });

      // Úprava priorit podle času
      if (responses.timeframe && ['days', '2weeks'].includes(responses.timeframe[0])) {
        items = items.map(item => {
          if (item.priority === 'nice_to_have') {
            return { ...item, priority: 'important' };
          }
          return item;
        });
      }

      // Seřadit podle priority
      return items.sort((a, b) => {
        const order = { critical: 0, important: 1, nice_to_have: 2 };
        return order[a.priority] - order[b.priority];
      });
    }

    // =====================================================
    // KOMPONENTY
    // =====================================================

    function LandingScreen({ onStart, onFamily, onExpert }) {
      return (
        <div className="screen">
          <h1 id="dostal-jsi-rozsudek-a-nev-co-dlat">Dostal jsi rozsudek a nevíš co dělat?</h1>
          <p>Pomůžeme ti zorientovat se. Za 10 minut budeš mít jasný plán, co vyřídit před nástupem.</p>

          <button
            onClick={onStart}
            style={{
              background: 'linear-gradient(135deg, #38b4e0, #158ebf)',
              color: 'white',
              border: 'none',
              width: '100%',
              fontSize: '18px',
              padding: '18px',
              fontWeight: '600'
            }}>
            Začít →
          </button>

          <p style={{ marginTop: '32px', color: '#666', fontSize: '14px' }}>Nebo:</p>
          <button onClick={onFamily} className="option">👨‍👩‍👧 Jsem blízký odsouzeného</button>
          <button onClick={onExpert} className="option">👔 Jsem odborník v poradně</button>

          <div className="contact-card" style={{ marginTop: '24px' }}>
            <strong>📞 Potřebuješ pomoct hned?</strong><br/>
            Krizová linka: <a href="tel:116123">116 123</a> (24/7, zdarma)
          </div>

          <div className="footer">
            Projekt vznikl ve spolupráci s <a href="https://sovia.cz" target="_blank" rel="noopener">Sovia z.s.</a>
            <br /><small>Mám rozsudek a co dál?</small>
          </div>
        </div>
      );
    }

    function DiagnosticScreen({ question, questionIndex, totalQuestions, responses, onAnswer, onNext, onBack }) {
      const q = question;
      const currentValue = responses[q.id] || [];

      const handleOptionClick = (optionId, exclusive) => {
        let newValue;
        if (q.multiSelect) {
          if (exclusive) {
            newValue = [optionId];
          } else {
            if (currentValue.includes(optionId)) {
              newValue = currentValue.filter(v => v !== optionId);
            } else {
              newValue = [...currentValue.filter(v => {
                const opt = q.options.find(o => o.id === v);
                return !opt?.exclusive;
              }), optionId];
            }
          }
        } else {
          newValue = [optionId];
        }
        onAnswer(q.id, newValue);
      };

      const canContinue = currentValue.length > 0;

      return (
        <div className="screen">
          <div className="progress">
            <div className="progress-bar" style={{ width: `${((questionIndex + 1) / totalQuestions) * 100}%` }} />
          </div>
          <small style={{ color: '#666' }}>Krok {questionIndex + 1} z {totalQuestions}</small>

          <h2 style={{ marginTop: '16px' }}>{q.question}</h2>
          <p style={{ color: '#666' }}>{q.subtext}</p>

          <div style={{ marginTop: '20px' }}>
            {q.options.map(opt => (
              <button
                key={opt.id}
                className={`option ${currentValue.includes(opt.id) ? 'selected' : ''}`}
                onClick={() => handleOptionClick(opt.id, opt.exclusive)}
              >
                <span style={{ fontSize: '20px', marginRight: '8px' }}>{opt.emoji}</span>
                {opt.label}
              </button>
            ))}
          </div>

          {q.multiSelect && <small style={{ color: '#888', display: 'block', marginTop: '8px' }}>💡 Můžeš vybrat víc možností</small>}

          <div className="nav-buttons">
            <button
              onClick={onBack}
              style={{ background: 'white', border: '1px solid #ddd' }}
            >
              ← Zpět
            </button>
            <button
              onClick={onNext}
              disabled={!canContinue}
              style={{
                background: canContinue ? 'linear-gradient(135deg, #38b4e0, #158ebf)' : '#ccc',
                color: 'white',
                border: 'none',
                opacity: canContinue ? 1 : 0.5
              }}
            >
              Pokračovat →
            </button>
          </div>
        </div>
      );
    }

    function PlanScreen({ plan, completed, onItemClick, onReset }) {
      const completedCount = plan.reduce((acc, item) =>
        acc + item.checklist.filter(c => completed[`${item.id}:${c.id}`]).length, 0
      );
      const totalCount = plan.reduce((acc, item) => acc + item.checklist.length, 0);
      const progress = totalCount > 0 ? (completedCount / totalCount) * 100 : 0;

      const priorityLabels = {
        critical: '🔴 UDĚLEJ IHNED',
        important: '🟡 DŮLEŽITÉ',
        nice_to_have: '🟢 PŘED NÁSTUPEM'
      };

      return (
        <div className="screen">
          <h1 id="tvj-pln">Tvůj plán</h1>
          <p style={{ marginBottom: '8px' }}>
            Připravili jsme ti seznam věcí na základě tvé situace.
          </p>
          <p style={{ fontWeight: '600', color: '#38b4e0' }}>
            Hotovo: {completedCount} / {totalCount} úkolů
          </p>

          <div className="progress">
            <div className="progress-bar" style={{ width: `${progress}%` }} />
          </div>

          {['critical', 'important', 'nice_to_have'].map(priority => {
            const items = plan.filter(i => i.priority === priority);
            if (items.length === 0) return null;

            return (
              <div key={priority}>
                <h3 style={{ marginTop: '28px', marginBottom: '12px' }}>
                  {priorityLabels[priority]}
                </h3>
                {items.map(item => {
                  const itemCompleted = item.checklist.filter(c => completed[`${item.id}:${c.id}`]).length;
                  const itemTotal = item.checklist.length;
                  const isDone = itemCompleted === itemTotal;

                  return (
                    <div
                      key={item.id}
                      className={`plan-item priority-${priority === 'nice_to_have' ? 'nice' : priority}`}
                      onClick={() => onItemClick(item)}
                      style={{ cursor: 'pointer', opacity: isDone ? 0.7 : 1 }}
                    >
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                        <h3 style={{ textDecoration: isDone ? 'line-through' : 'none' }}>{item.title}</h3>
                        {isDone && <span style={{ color: '#10b981', fontSize: '20px' }}>✓</span>}
                      </div>
                      <p style={{ color: '#666', fontSize: '14px', marginBottom: '8px' }}>{item.description}</p>
                      <small style={{ color: '#888' }}>{itemCompleted} / {itemTotal} hotovo</small>
                    </div>
                  );
                })}
              </div>
            );
          })}

          <div className="contact-card" style={{ marginTop: '32px' }}>
            <strong>📞 Potřebuješ pomoct?</strong><br/>
            Krizová linka: <a href="tel:116123">116 123</a> (24/7, zdarma)
          </div>

          <div className="footer">
            <button
              onClick={onReset}
              style={{ fontSize: '14px', background: 'white', border: '1px solid #ddd' }}
            >
              Začít znovu
            </button>
            <br /><br />
            Projekt <a href="https://sovia.cz" target="_blank" rel="noopener">Sovia z.s.</a> – Mám rozsudek a co dál?
          </div>
        </div>
      );
    }

    function ItemDetailScreen({ item, completed, onToggle, onBack }) {
      const itemCompleted = item.checklist.filter(c => completed[`${item.id}:${c.id}`]).length;
      const itemTotal = item.checklist.length;

      return (
        <div className="screen">
          <button
            onClick={onBack}
            style={{ marginBottom: '16px', background: 'white', border: '1px solid #ddd' }}
          >
            ← Zpět na plán
          </button>

          <h1 id="itemtitle">{item.title}</h1>
          <p>{item.description}</p>

          <p style={{ fontWeight: '600', color: '#38b4e0', margin: '16px 0' }}>
            {itemCompleted} / {itemTotal} hotovo
          </p>

          {item.warning && (
            <div className="warning">
              ⚠️ {item.warning}
            </div>
          )}

          {item.tips && item.tips.map((tip, i) => (
            <div key={i} className="tip">
              💡 {tip}
            </div>
          ))}

          <h3 style={{ marginTop: '24px', marginBottom: '16px' }}>Co je potřeba udělat:</h3>

          {item.checklist.map(check => {
            const key = `${item.id}:${check.id}`;
            const isChecked = !!completed[key];
            return (
              <label key={check.id} className="checklist-item" style={{ cursor: 'pointer' }}>
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggle(key)}
                />
                <span style={{
                  textDecoration: isChecked ? 'line-through' : 'none',
                  color: isChecked ? '#999' : '#333'
                }}>
                  {check.text}
                </span>
              </label>
            );
          })}

          <div className="contact-card" style={{ marginTop: '32px' }}>
            <strong>📞 Potřebuješ pomoct?</strong><br/>
            Krizová linka: <a href="tel:116123">116 123</a> (24/7, zdarma)
          </div>
        </div>
      );
    }

    function FamilyScreen({ onBack }) {
      return (
        <div className="screen">
          <button onClick={onBack} style={{ background: 'white', border: '1px solid #ddd' }}>← Zpět</button>

          <h1 style={{ marginTop: '16px' }}>Pro rodiny a blízké</h1>
          <p>Tvůj blízký nastupuje do výkonu trestu. Je to těžká situace pro vás oba. Tady jsou informace, které ti pomůžou.</p>

          <h3 style={{ marginTop: '24px' }}>Jak mu pomoci TEĎ</h3>
          <ul style={{ paddingLeft: '20px', marginBottom: '16px' }}>
            <li>Pomoz mu s checklistem věcí k vyřízení</li>
            <li>Nabídni se, že něco vyřídíš za něj (úřady, smlouvy...)</li>
            <li>Doprovod ho k bráně věznice - je to důležitější, než si myslíš</li>
            <li>Buď trpělivý - může být ve stresu nebo šoku</li>
          </ul>

          <h3 id="co-nepomh">Co NEPOMÁHÁ</h3>
          <ul style={{ paddingLeft: '20px', marginBottom: '16px' }}>
            <li>"Já ti to říkal/a"</li>
            <li>"Ty ses do toho dostal sám"</li>
            <li>Vyhýbání se tématu</li>
            <li>Předstírání, že se nic neděje</li>
          </ul>

          <h3 id="komunikace-bhem-trestu">Komunikace během trestu</h3>
          <ul style={{ paddingLeft: '20px', marginBottom: '16px' }}>
            <li><strong>Návštěvy:</strong> obvykle 1x za 2-3 týdny, musíš být na seznamu</li>
            <li><strong>Dopisy:</strong> můžeš psát kdykoliv, jsou kontrolované</li>
            <li><strong>Telefony:</strong> volá on tobě, z kreditu</li>
            <li><strong>Peníze:</strong> posíláš na vězeňský účet</li>
          </ul>

          <div className="contact-card">
            <strong>📞 Linka pro rodiny odsouzených</strong><br/>
            <a href="tel:116123">116 123</a> (24/7, zdarma)
          </div>

          <div className="footer">
            Projekt <a href="https://sovia.cz" target="_blank" rel="noopener">Sovia z.s.</a>
          </div>
        </div>
      );
    }

    function ExpertScreen({ onBack }) {
      return (
        <div className="screen">
          <button onClick={onBack} style={{ background: 'white', border: '1px solid #ddd' }}>← Zpět</button>

          <h1 style={{ marginTop: '16px' }}>Pro odborníky</h1>
          <p>Tento nástroj můžete využít při práci s klienty před nástupem do VTOS.</p>

          <h3 style={{ marginTop: '24px' }}>Jak nástroj využít</h3>
          <ul style={{ paddingLeft: '20px', marginBottom: '16px' }}>
            <li>Projděte diagnostiku společně s klientem</li>
            <li>Vygenerovaný plán slouží jako základ pro další práci</li>
            <li>Checklisty lze vytisknout (Ctrl+P)</li>
            <li>Klient si může plán uložit na svém telefonu</li>
          </ul>

          <h3 id="o-projektu">O projektu</h3>
          <p>
            Nástroj vznikl v rámci projektu "Mám rozsudek a co dál?" organizace Sovia z.s.
            na základě výzkumu s prvně odsouzenými.
          </p>

          <div className="contact-card">
            <strong>📧 Kontakt pro odborníky</strong><br/>
            <a href="mailto:sovia@sovia.cz">sovia@sovia.cz</a>
          </div>

          <div className="footer">
            Projekt <a href="https://sovia.cz" target="_blank" rel="noopener">Sovia z.s.</a> – Mám rozsudek a co dál?
          </div>
        </div>
      );
    }

    // =====================================================
    // MAIN APP
    // =====================================================

    function App() {
      const [screen, setScreen] = useState('landing');
      const [questionIndex, setQuestionIndex] = useState(0);
      const [responses, setResponses] = useLocalStorage('vtos-responses-v2', {});
      const [completed, setCompleted] = useLocalStorage('vtos-completed-v2', {});
      const [selectedItem, setSelectedItem] = useState(null);

      const plan = useMemo(() => generatePlan(responses), [responses]);

      const handleAnswer = (field, value) => {
        setResponses(prev => ({ ...prev, [field]: value }));
      };

      const handleNext = () => {
        if (questionIndex < DIAGNOSTIC_QUESTIONS.length - 1) {
          setQuestionIndex(prev => prev + 1);
        } else {
          setScreen('plan');
        }
      };

      const handleBack = () => {
        if (questionIndex > 0) {
          setQuestionIndex(prev => prev - 1);
        } else {
          setScreen('landing');
        }
      };

      const handleToggle = (key) => {
        setCompleted(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleReset = () => {
        setResponses({});
        setCompleted({});
        setQuestionIndex(0);
        setScreen('landing');
      };

      if (screen === 'landing') {
        return (
          <LandingScreen
            onStart={() => setScreen('diagnostic')}
            onFamily={() => setScreen('family')}
            onExpert={() => setScreen('expert')}
          />
        );
      }

      if (screen === 'diagnostic') {
        return (
          <DiagnosticScreen
            question={DIAGNOSTIC_QUESTIONS[questionIndex]}
            questionIndex={questionIndex}
            totalQuestions={DIAGNOSTIC_QUESTIONS.length}
            responses={responses}
            onAnswer={handleAnswer}
            onNext={handleNext}
            onBack={handleBack}
          />
        );
      }

      if (screen === 'plan') {
        return (
          <PlanScreen
            plan={plan}
            completed={completed}
            onItemClick={(item) => { setSelectedItem(item); setScreen('detail'); }}
            onReset={handleReset}
          />
        );
      }

      if (screen === 'detail' && selectedItem) {
        return (
          <ItemDetailScreen
            item={selectedItem}
            completed={completed}
            onToggle={handleToggle}
            onBack={() => setScreen('plan')}
          />
        );
      }

      if (screen === 'family') {
        return <FamilyScreen onBack={() => setScreen('landing')} />;
      }

      if (screen === 'expert') {
        return <ExpertScreen onBack={() => setScreen('landing')} />;
      }

      return <div>Něco se pokazilo...</div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
